name: scripts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts.yml'

# Least privilege: lint and a self-contained test.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: shellcheck + devstack tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: devstack tests
        # Starts no containers; the fixtures it needs are a bash it can copy
        # and a python listener.
        run: scripts/devstack-test.sh
